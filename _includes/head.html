<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{%- unless page.image %}
<!-- Share preview: pages without their own image use the Max Verstappen photo -->
<meta property="og:image" content="{{ '/images/max-verstappen.jpg' | absolute_url }}">
<meta property="og:image:width" content="450">
<meta property="og:image:height" content="600">
<meta property="og:image:alt" content="Max Verstappen">
<meta name="twitter:image" content="{{ '/images/max-verstappen.jpg' | absolute_url }}">
{%- endunless %}
<link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700;1,900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script>
  // Apply the saved theme before first paint. Dark is the default.
  (function () {
    var theme = 'dark';
    try { theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
{%- if page.math %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"
  onload="renderMathInElement(document.querySelector('main'), {delimiters: [{left: '$$', right: '$$', display: true}, {left: '\\[', right: '\\]', display: true}, {left: '\\(', right: '\\)', display: false}, {left: '$', right: '$', display: false}], throwOnError: false});"></script>
{%- endif %}
