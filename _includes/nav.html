{%- assign home = '/' | relative_url -%}
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ home }}" aria-label="Home">
      <span class="brand-num">3</span>
      <span class="brand-name">Inseok <b>Kong</b></span>
    </a>
    <nav class="topnav" aria-label="Main">
      <a href="{{ home }}#about">About</a>
      <a href="{{ home }}#news">News</a>
      <a href="{{ home }}#publications">Publications</a>
      <a href="{{ home }}#career">Background</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' and page.url != '/blog/schedule/' %} class="is-active"{% endif %}>Blog</a>
    </nav>
    <a class="nav-schedule{% if page.url == '/blog/schedule/' %} is-active{% endif %}" href="{{ '/blog/schedule/' | relative_url }}" aria-label="Schedule">{% include icon.html name="calendar" %}<span>Schedule</span></a>
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
      <span class="theme-icon theme-icon-sun">{% include icon.html name="sun" %}</span>
      <span class="theme-icon theme-icon-moon">{% include icon.html name="moon" %}</span>
    </button>
  </div>
  <div class="livery-stripe" aria-hidden="true"></div>
</header>
