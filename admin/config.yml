# Sveltia CMS config for the blog editor at /admin/.
# Sign in with "Sign In with Token" using a GitHub fine-grained token
# that has Contents: Read and write on iskong17/iskong17.github.io.
backend:
  name: github
  repo: iskong17/iskong17.github.io
  branch: main
  commit_messages:
    create: "Blog: create {{slug}}"
    update: "Blog: update {{slug}}"
    delete: "Blog: delete {{slug}}"
    uploadMedia: "Blog: upload {{path}}"
    deleteMedia: "Blog: delete {{path}}"

site_url: https://iskong17.github.io
display_url: https://iskong17.github.io/blog/
locale: ko

media_folder: images/blog
public_folder: /images/blog

collections:
  - name: posts
    label: 블로그 글
    label_singular: 글
    folder: _posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    summary: "{{date | date('YYYY.MM.DD')}} · {{title}}"
    sortable_fields: [date, title, category]
    fields:
      - label: 제목
        name: title
        widget: string
      - label: 주소 (영문)
        name: slug
        widget: string
        hint: "URL에 쓰일 영문 이름입니다. 소문자와 하이픈만 쓰세요. 예: japan-gp-review"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "소문자, 숫자, 하이픈만 쓸 수 있습니다"]
      - label: 날짜
        name: date
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss ZZ"
      - label: 카테고리
        name: category
        widget: select
        default: study
        options:
          - { label: "Study (공부)", value: study }
          - { label: "Race Review (레이스 리뷰)", value: race-review }
          - { label: "Pit Log (기록)", value: log }
      - label: 한 줄 요약
        name: description
        widget: string
        required: false
      - label: 그랑프리 (레이스 리뷰만)
        name: gp
        widget: string
        required: false
        hint: "예: Mexico City Grand Prix"
      - label: 라운드
        name: round
        widget: number
        value_type: int
        required: false
      - label: 서킷
        name: circuit
        widget: string
        required: false
      - label: "#33 결과"
        name: result
        widget: string
        required: false
        hint: "예: P1, P3, DNF"
      - label: 본문
        name: body
        widget: richtext
        modes: [raw, rich_text]
        hint: "LaTeX는 raw 모드에서 쓰세요. 문장 안 수식은 $$ ... $$, 독립된 줄의 수식은 앞뒤를 빈 줄로 감싼 $$ ... $$ 입니다."
