title: Inseok Kong
description: >-
  Undergraduate researcher at the University of Seoul working on trustworthy
  computer vision. Also writes about Formula 1.
url: https://iskong17.github.io
baseurl: ""
lang: en
timezone: Asia/Seoul

author:
  name: Inseok Kong
  email: kong7963@uos.ac.kr

social:
  email: kong7963@uos.ac.kr
  cv: /files/Inseok_Kong_CV_10_20.pdf
  scholar: https://scholar.google.com/citations?user=N1GcUZgAAAAJ&hl=ko
  github: https://github.com/iskong17
  linkedin: https://www.linkedin.com/in/iskong

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:day/:title/

collections:
  circuits:
    output: true
    permalink: /blog/race/circuits/:name/
  drivers:
    output: true
    permalink: /blog/race/drivers/:name/
  # Korean versions of paper reviews; each sets `en:` to the slug of its English post.
  paper_ko:
    output: true
    permalink: /blog/paper-review/ko/:name/

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: circuits
    values:
      layout: circuit
      lang: en
  - scope:
      path: ""
      type: drivers
    values:
      layout: driver
      lang: en
  - scope:
      path: ""
      type: paper_ko
    values:
      layout: post
      lang: ko
      math: true
      category: paper-review
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: ko
      math: true

exclude:
  - scripts
  - cv.tex
  - "*.tex"
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
