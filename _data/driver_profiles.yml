  style_heading: "Driver profile"
  style: "Following Verstappen's maiden pole position at the 2019 Hungarian Grand Prix, former Formula One World Champion Nico Rosberg described him as the fastest driver in Formula One. Rosberg elucidated that Verstappen did not have the fastest car during the qualifying session in Hungary, emphasising that it was Verstappen's raw speed that allowed him to secure pole position: \"Mercedes still had the fastest car, and it's just Verstappen with his driving that put it up there in pole.\""
