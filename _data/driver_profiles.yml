  style_heading: "Driver profile"
  style: "Piastri has been noted by drivers and critics for his composure under pressure. In 2023, Scott Mitchell-Malm of The Race compared his \"relaxed intensity\" to that of Max Verstappen. Upon winning the 2024 Azerbaijan Grand Prix, Luke Smith of The New York Times stated that \"stress isn't an emotion one would associate with Piastri. His calm, collected demeanor has been present right from his junior days.\" This quality prompted several journalists to list him as a favourite for the 2025 World Drivers' Championship after the Bahrain Grand Prix, with Martin Brundle comparing him to Alain Prost. Andrew Benson of BBC Sport stated \"combining consistent speed [with] mental solidity and racing decisiveness [makes him] a formidable rival\". After winning the Saudi Arabian Grand Prix, title rival Verstappen stated \"he's very calm in his approach, and I like that."
russell:
