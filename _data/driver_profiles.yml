    source: "https://commons.wikimedia.org/wiki/File:Charles_Leclerc_at_the_2026_Cannes_Film_Festival_(cropped).jpg"
  style_heading: "Driver profile"
  style: "Leclerc has a strong qualifying history in Formula One, where he holds the record for most pole positions without a World Drivers' Championship (27) and the eleventh-most in history. He also holds the record in either FIA Formula 2 or its predecessor GP2 for the most pole positions in a season (8). His driving style tends to favour a car with oversteer, allowing for precise micro-corrections and high cornering speeds, which has aided his qualifying pace. He became the youngest recipient of the FIA Pole Trophy in 2019 for achieving the most pole positions, a feat he repeated in 2022. Critics have noted his ability to outperform his machinery in qualifying conditions, which has frequently led to his one-lap pace relatively surpassing his race pace and contributed to a pole–win conversion rate of 18.5%."
