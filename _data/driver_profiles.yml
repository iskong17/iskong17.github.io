  style_heading: "Driving style"
  style: "Alonso is often regarded as one of the greatest F1 drivers in the history of the sport. Journalists and fellow drivers regarded Alonso as a fast and consistent driver who can extract additional pace from a car in all weathers and on all tracks. Fisichella said Alonso understands when to go faster and when to preserve his tyres in a race. Former racing driver and Sky Sports pundit Martin Brundle described Alonso as \"Senna-like in his intimate feel for where the grip is\" and cited the driver's knowledge on how much grip to use for the entry to a turn. He drives aggressively and uses a braking area to put a car into a corner without losing speed exiting it. This allows Alonso to keep it \"on the edge of adhesion\" and it has been observed during a qualifying session and the first laps of a race. 1979 world champion Jody Scheckter has criticised Alonso for causing problems in teams."
