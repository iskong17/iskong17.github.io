# Blog categories, in tab order. Use the key in a post's `category:` front matter.
# Study and Gallery posts also take a `topic:` key from their list below.
# `short` is used on small labels; `blurb` appears on the All tab.
- key: study
  label: "Study"
  short: "Study"
  blurb: "Deep Learning · Linear Algebra · Computer Vision · Algorithm"
  topics:
    - { key: deep-learning, label: "Deep Learning" }
    - { key: linear-algebra, label: "Linear Algebra" }
    - { key: computer-vision, label: "Computer Vision" }
    - { key: algorithm, label: "Algorithm" }
- key: paper-review
  label: "Paper Review"
  short: "Paper"
  blurb: "TTA · Calibration · 3DPC · Hallucination · VLM · AVLLM"
  # Tags for paper reviews. A post lists the keys that apply in `subfields:`.
  subfields:
    - { key: tta, label: "TTA" }
    - { key: calibration, label: "Calibration" }
    - { key: 3dpc, label: "3DPC" }
    - { key: hallucination, label: "Hallucination" }
    - { key: vlm, label: "VLM" }
    - { key: avllm, label: "AVLLM" }
- key: gallery
  label: "Gallery"
  short: "Gallery"
  blurb: "Conference · Travel, on a world map"
  topics:
    - { key: conference, label: "Conference" }
    - { key: travel, label: "Travel" }
- key: race
  label: "Formula 1 (F1)"
  short: "F1"
  blurb: "Race reports since 2021 · Circuits · Drivers"
